# Pengecualian secret scanning GitHub (tiket 261115101501).
# Folder tes hanya berisi token tiruan (bentuk <angka>:<huruf acak>) yang
# dibutuhkan tes pendaftaran dan penyensoran token. Token asli TIDAK BOLEH
# masuk ke folder ini: GitHub tidak akan mendeteksinya.
# Sumber: https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
paths-ignore:
  - "master/test/**"
  - "plugin/test/**"
